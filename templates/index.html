<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#484643" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="VIP Заказы" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>VIP-заказы</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon.png" type="image/png" />
    <link rel="icon" href="/icons/icon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <link rel="stylesheet" href="/assets/app.css" />
  </head>
  <body>
    <div class="shell">
      <header class="hero">
        <div class="company-strip" aria-label="Компании ГК Иплана">
          <img src="/assets/iplana-logo.png" alt="Иплана" class="company-strip__logo company-strip__logo--iplana" />
          <img src="/assets/iplana-pro-logo.png" alt="Иплана ПРО" class="company-strip__logo company-strip__logo--pro" />
          <img src="/assets/stalko-logo.svg" alt="Сталко ИПЛ" class="company-strip__logo company-strip__logo--stalko" />
          <img src="/assets/stpro-logo.png" alt="СТ-ПРО" class="company-strip__logo company-strip__logo--stpro" />
        </div>

        <div class="hero__title">
          <p class="eyebrow">Реестр VIP-заказов</p>
        </div>

        <label class="search search--hero">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="11" cy="11" r="7" />
            <path d="m20 20-3.2-3.2" />
          </svg>
          <input id="searchInput" type="search" placeholder="Поиск по проекту, заказчику, предмету или стадии" autocomplete="off" />
        </label>

        <div class="hero__panel" aria-live="polite">
          <span class="hero__label">Обновление</span>
          <strong id="lastUpdated">загрузка</strong>
          <button class="icon-button" id="refreshButton" type="button" aria-label="Обновить данные" title="Обновить данные">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M21 12a9 9 0 0 1-15.3 6.4M3 12A9 9 0 0 1 18.3 5.6" />
              <path d="M21 4v6h-6M3 20v-6h6" />
            </svg>
          </button>
        </div>
      </header>

      <section class="notice notice--hidden" id="notice" role="status"></section>

      <main class="workspace">
        <section class="table-shell">
          <div class="table-topline">
            <div>
              <strong id="resultCount">0 заказов</strong>
              <span id="activeFilters">без фильтров</span>
            </div>
          </div>

          <div class="loading" id="loading">
            <span></span>
            <span></span>
            <span></span>
          </div>

          <div class="empty empty--hidden" id="emptyState">
            <strong>Ничего не найдено</strong>
            <p>Измените запрос или сбросьте фильтры.</p>
          </div>

          <div class="table-wrap" id="tableWrap" hidden>
            <table>
              <thead>
                <tr>
                  <th>№</th>
                  <th>Проект</th>
                  <th>Ответственный</th>
                  <th>Заказчик</th>
                  <th>Предмет</th>
                  <th>Стадия расчета</th>
                  <th>Обновлено</th>
                </tr>
              </thead>
              <tbody id="ordersBody"></tbody>
            </table>
          </div>

          <div class="cards" id="cards" hidden></div>
        </section>
      </main>
    </div>

    <div class="filter-backdrop" id="filterBackdrop" hidden></div>
    <aside class="filter-sheet" id="filterDrawer" aria-labelledby="filterTitle" aria-hidden="true" hidden>
      <div class="filter-sheet__handle" aria-hidden="true"></div>
      <div class="filter-sheet__header">
        <div>
          <span class="filter-sheet__eyebrow">Параметры отображения</span>
          <h2 id="filterTitle">Фильтр</h2>
        </div>
        <button class="filter-sheet__close" id="filterClose" type="button" aria-label="Скрыть фильтр">×</button>
      </div>

      <div class="selects">
        <label>
          <span>Ответственный</span>
          <select id="responsibleFilter">
            <option value="">Все</option>
          </select>
        </label>
        <label>
          <span>Стадия</span>
          <select id="stageFilter">
            <option value="">Все</option>
          </select>
        </label>
        <label>
          <span>Сортировка</span>
          <select id="sortSelect">
            <option value="updated-desc">Сначала обновленные</option>
            <option value="project-asc">Проект A-Z</option>
            <option value="customer-asc">Заказчик A-Z</option>
            <option value="stage-asc">Стадия A-Z</option>
          </select>
        </label>
      </div>

      <section class="chips" id="stageChips" aria-label="Быстрые фильтры по стадиям"></section>

      <div class="filter-sheet__actions">
        <button class="text-button" id="resetButton" type="button">Сбросить</button>
        <button class="text-button text-button--solid" id="filterApply" type="button">Скрыть</button>
      </div>
    </aside>

    <button class="filter-toggle" id="filterToggle" type="button" aria-controls="filterDrawer" aria-expanded="false">
      Параметры отбора
    </button>

    <script src="/assets/app.js" defer></script>
  </body>
</html>
